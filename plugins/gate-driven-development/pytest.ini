[pytest]
# -n auto は論理 CPU 数ぶん worker を起動する。コア数の多い Mac でコア数ぶんの worker にしても、
# 8 worker とほぼ同じ時間で、負荷平均だけが大きく上がった（2026-10-04 に測った）。複数のセッションが
# 同時に回すとマシンが詰まるので、8 で頭打ちにする。一時的に変えるならコマンドラインで
# --maxprocesses=N を渡す（addopts より後ろが勝つ）。
addopts = -n auto --maxprocesses=8 --dist worksteal --durations=30 --durations-min=1.0
